<style>
#sc-next-options{--nx-bg:light-dark(#f1efea,#222523);--nx-paper:light-dark(#fcfaf7,#2c302c);--nx-ink:light-dark(#312f2b,#f1eee6);--nx-muted:light-dark(#655f55,#bdb9af);--nx-border:light-dark(#dcd7ce,#484c44);--nx-brand:light-dark(#4e5744,#b6c5a0);--nx-brand-fill:light-dark(#4e5744,#b6c5a0);--nx-brand-text:light-dark(#fffdf7,#22291c);--nx-soft:light-dark(#e6e9df,#363f30);--nx-good:light-dark(#306444,#a2d1ad);--nx-warn:light-dark(#865710,#eac18a);--nx-header:light-dark(#393b33,#1d211c);--nx-header-ink:#f5f1e8;--nx-header-muted:#d4d2c7;--nx-input:light-dark(#fffefa,#252925);color:var(--nx-ink);font:14px/1.5 system-ui,sans-serif;width:100%}
#sc-next-options *{box-sizing:border-box}#sc-next-options [hidden]{display:none!important}
#sc-next-options .nx-preview{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:0 90px 16px 0}#sc-next-options .nx-preview>span{font-size:11px;letter-spacing:1px;color:var(--nx-muted)}#sc-next-options .nx-preview>div{display:flex;gap:6px;flex-wrap:wrap}
#sc-next-options button{font:inherit;font-weight:500;color:var(--nx-ink);background:var(--nx-paper);border:1px solid var(--nx-border);border-radius:6px;padding:9px 15px;min-height:40px;cursor:default}#sc-next-options button:hover{background:var(--nx-soft)}#sc-next-options button:focus-visible,#sc-next-options input:focus-visible,#sc-next-options textarea:focus-visible,#sc-next-options select:focus-visible,#sc-next-options summary:focus-visible{outline:2px solid var(--nx-brand);outline-offset:3px}#sc-next-options button:disabled{opacity:.5}#sc-next-options .nx-preview button{font-size:12px;border-radius:20px;min-height:34px}#sc-next-options .nx-preview button[aria-pressed=true]{background:var(--nx-brand-fill);border-color:var(--nx-brand-fill);color:var(--nx-brand-text)}
#sc-next-options .nx-product{background:var(--nx-bg);border:1px solid var(--nx-border);border-radius:10px;min-height:770px;overflow:clip}#sc-next-options .nx-header{background:var(--nx-header);color:var(--nx-header-ink);padding:17px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}#sc-next-options .nx-wordmark{font-size:18px;font-weight:500;letter-spacing:-.4px;display:flex;gap:10px;align-items:center}#sc-next-options .nx-logo{font-family:Georgia,serif;border:1px solid #a5ab95;padding:0 6px;border-radius:4px;font-size:17px}#sc-next-options .nx-context{font-size:12px;color:var(--nx-header-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}#sc-next-options .nx-top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}#sc-next-options .nx-header button{background:transparent;color:var(--nx-header-ink);border-color:#737869;font-size:12px;padding:7px 11px;min-height:34px}#sc-next-options .nx-header button:hover{background:#4c5144}
#sc-next-options .nx-nav{display:flex;gap:2px;padding:0 22px;background:var(--nx-paper);border-bottom:1px solid var(--nx-border);flex-wrap:wrap}#sc-next-options .nx-nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:14px 15px;display:flex;gap:8px;align-items:center}#sc-next-options .nx-nav button[aria-current=page]{border-bottom-color:var(--nx-brand);color:var(--nx-brand)}#sc-next-options svg{width:17px;height:17px;flex-shrink:0}#sc-next-options .nx-nav .nx-settings{margin-left:auto}
#sc-next-options .nx-breadcrumb{display:flex;align-items:center;gap:8px;padding:12px 26px;background:var(--nx-paper);border-bottom:1px solid var(--nx-border);font-size:12px;color:var(--nx-muted);flex-wrap:wrap}#sc-next-options .nx-breadcrumb button{padding:3px 6px;min-height:28px;border:0;background:transparent;color:var(--nx-brand)}#sc-next-options .nx-launcher{margin:18px 26px 0;padding:20px;background:var(--nx-paper);border:1px solid var(--nx-border);border-radius:8px}#sc-next-options .nx-launcher-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}#sc-next-options .nx-launcher-grid button{display:flex;gap:8px;align-items:center;text-align:left;flex-wrap:wrap;padding:14px 10px}
#sc-next-options .nx-main{padding:28px 32px;min-width:0}#sc-next-options h1{font-size:29px;line-height:1.2;letter-spacing:-.7px;font-weight:500;margin:0 0 9px}#sc-next-options h2{font-size:17px;font-weight:500;margin:0 0 12px}#sc-next-options h3{font-size:14px;font-weight:500;margin:0 0 5px}#sc-next-options p{margin:0 0 18px}#sc-next-options .nx-muted{color:var(--nx-muted)}#sc-next-options .nx-eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--nx-muted);margin-bottom:11px}
#sc-next-options .nx-welcome{padding-bottom:22px;border-bottom:1px solid var(--nx-border)}#sc-next-options .nx-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 28px}#sc-next-options .nx-quick button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:18px;min-width:0}#sc-next-options .nx-quick svg{color:var(--nx-brand)}#sc-next-options .nx-quick strong{font-size:15px;font-weight:500}#sc-next-options .nx-quick small{font-size:12px;color:var(--nx-muted);font-weight:400;min-height:36px}#sc-next-options .nx-quick span{font-size:11px;color:var(--nx-good);font-weight:400}#sc-next-options .nx-quick span.nx-missing{color:var(--nx-warn)}
#sc-next-options .nx-columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:30px}#sc-next-options .nx-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--nx-border)}#sc-next-options .nx-row p{font-size:12px;color:var(--nx-muted);margin:4px 0 0}#sc-next-options .nx-link{color:var(--nx-brand);background:transparent;border:0;padding:5px 0;min-height:30px;font-size:12px}#sc-next-options .nx-panel{background:var(--nx-paper);border:1px solid var(--nx-border);border-radius:8px;padding:22px;margin-top:20px}#sc-next-options .nx-tag{font-size:11px;color:var(--nx-good);font-weight:400}#sc-next-options .nx-tag.nx-missing{color:var(--nx-warn)}#sc-next-options .nx-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px}#sc-next-options .nx-primary{background:var(--nx-brand-fill);color:var(--nx-brand-text);border-color:var(--nx-brand-fill)}#sc-next-options .nx-primary:hover{background:var(--nx-brand-fill);filter:brightness(1.08)}
#sc-next-options label{display:block;font-size:13px;margin-bottom:15px}#sc-next-options input:not([type=checkbox]),#sc-next-options select,#sc-next-options textarea{font:inherit;width:100%;min-width:0;margin-top:6px;padding:10px 12px;border:1px solid var(--nx-border);border-radius:5px;background:var(--nx-input);color:var(--nx-ink)}#sc-next-options textarea{font-family:ui-monospace,monospace;font-size:12px;resize:vertical;min-height:100px}#sc-next-options .nx-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}#sc-next-options small{font-size:12px}#sc-next-options .nx-help{display:block;color:var(--nx-muted);font-size:12px;margin:7px 0 14px}#sc-next-options .nx-stepbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}#sc-next-options .nx-stepbar button{font-size:12px;padding:8px 10px}#sc-next-options .nx-stepbar button[aria-current=step]{background:var(--nx-soft);border-color:var(--nx-brand)}#sc-next-options .nx-notice{border-left:3px solid var(--nx-brand);background:var(--nx-soft);padding:13px 16px;margin-top:18px;font-size:13px}#sc-next-options .nx-bottom{border-top:1px solid var(--nx-border);background:var(--nx-paper);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px}#sc-next-options .nx-bottom button{font-size:12px;padding:5px 12px;min-height:30px}#sc-next-options pre{background:light-dark(#e9e7df,#1e221e);color:var(--nx-ink);padding:18px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;margin:15px 0 0}#sc-next-options .nx-output{padding:0 26px 20px;background:var(--nx-paper)}#sc-next-options details{margin-top:16px;border-top:1px solid var(--nx-border)}#sc-next-options summary{padding:13px 0;font-weight:500}#sc-next-options .nx-feedback{font-size:12px;margin-top:12px;color:var(--nx-good)}#sc-next-options .nx-feedback[role=alert]{color:var(--nx-warn)}
@media(max-width:800px){#sc-next-options .nx-quick{grid-template-columns:repeat(2,minmax(0,1fr))}#sc-next-options .nx-columns{grid-template-columns:1fr;gap:20px}#sc-next-options .nx-main{padding:24px}#sc-next-options .nx-nav{padding:0 10px}#sc-next-options .nx-nav button{padding:12px 11px;font-size:12px}#sc-next-options .nx-product{min-height:930px}}
@media(max-width:480px){#sc-next-options .nx-preview{padding-right:0}#sc-next-options .nx-header{padding:16px;gap:12px}#sc-next-options .nx-main{padding:22px 16px}#sc-next-options .nx-fields{grid-template-columns:1fr;gap:0}#sc-next-options .nx-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 6px}#sc-next-options .nx-nav button{justify-content:center;padding:11px 4px;gap:5px}#sc-next-options .nx-nav .nx-settings{margin:0}#sc-next-options .nx-quick{gap:9px}#sc-next-options .nx-quick button{padding:14px 10px}#sc-next-options .nx-quick small{min-height:54px}#sc-next-options .nx-launcher{margin:14px 16px 0;padding:14px}#sc-next-options .nx-launcher-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#sc-next-options .nx-panel{padding:16px}#sc-next-options .nx-breadcrumb,#sc-next-options .nx-bottom{padding:12px 16px}#sc-next-options h1{font-size:25px}#sc-next-options .nx-product{min-height:1100px}}
@media(pointer:coarse){#sc-next-options button{min-height:44px}#sc-next-options input,#sc-next-options select,#sc-next-options textarea{font-size:16px}}
</style>
<script>
(()=>{
const root=document.getElementById('sc-next-options');
const tools=[['Deploy','package','Deploy your SuiteApps','Ready'],['SQL','database','Query your scrumbox database','Ready'],['SFTP','folder','Share files with NetSuite','Setup needed'],['Browser tests','flask-conical','Run Playwright tests','Setup needed']];
const names=['Scrumbox','Credentials','SuiteApps','Optional tools','Review'];
const saved=window.openai?.widgetState?.privateContent;
const initial=()=>({page:'Home',experience:'returning',step:0,setupComplete:true,menu:false,output:false,running:false,result:'',ready:{SFTP:false,'Browser tests':false},domain:'team-dev.vm.eng.netsuite.com',account:'000071',repo:'bank-feeds-nsn',branch:'develop',project:'bank-feeds-nsn/test-pw',credential:false,notice:''});
const models=saved?.version===2?saved.models:{top:initial(),launcher:initial()};
let experience=saved?.version===2?saved.experience:'returning';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const b=(text,action,css='')=>`<button type="button" class="${css}" data-do="${action}">${text}</button>`;
const field=(label,key,value)=>`<label>${label}<input data-value="${key}" value="${esc(value)}" autocomplete="off"></label>`;
const title=(trail,text,sub)=>`<div class="nx-eyebrow">${trail}</div><h1>${text}</h1><p class="nx-muted">${sub}</p>`;
function save(){window.openai?.setWidgetState?.({modelContent:{navigationOptions:['Top navigation','Tool launcher'],experience},privateContent:{version:2,experience,models}})?.catch(()=>{});}
function toolButtons(){return tools.map(([name,ic,desc])=>`<button type="button" data-do="open:${name}">${icon(ic)}${name}</button>`).join('');}
function home(s){return `<div class="nx-welcome">${title('WORKSPACE','Ready for your next task','Your scrumbox and SuiteApps are configured.')}</div><div class="nx-quick">${tools.map(([name,ic,desc,state])=>{const ready=state==='Ready'||s.ready[name];return `<button type="button" data-do="open:${name}">${icon(ic)}<strong>${name}</strong><small>${desc}</small><span class="${ready?'':'nx-missing'}">${ready?'Ready':'Setup needed'} →</span></button>`;}).join('')}</div><div class="nx-columns"><section><h2>Continue working</h2><div class="nx-row"><div><h3>${esc(s.repo)}</h3><p>${esc(s.branch)} · 1 deployment target</p></div>${b('Open Deploy →','open:Deploy','nx-link')}</div><div class="nx-row"><div><h3>SQL workspace</h3><p>First configured VM · ${esc(s.account)}</p></div>${b('Open SQL →','open:SQL','nx-link')}</div></section><section><h2>Workspace setup</h2><div class="nx-row"><div><h3>Shared setup complete</h3><p>Credentials and configuration saved.</p></div>${b('Manage','settings','nx-link')}</div><div class="nx-row"><div><h3>Optional tools</h3><p>Enable SFTP and browser tests when needed.</p></div>${b('Configure','optional','nx-link')}</div></section></div>`;}
function wizard(s){let body='';if(s.step===0)body=`<div class="nx-fields">${field('Scrumbox domain','domain',s.domain)}${field('NetSuite account ID','account',s.account)}</div><small class="nx-help">Use the domain without https://. SQL and SFTP use the first configured VM.</small>`;
if(s.step===1)body=`<p>Connect GitLab and register your certificate in NetSuite.</p><ol><li>Save a GitLab token when cloning repositories.</li><li>Generate or locate your certificate files.</li><li>Upload the public certificate in NetSuite’s OAuth 2.0 Client Credentials (M2M) Setup.</li><li>Save the certificate ID returned by NetSuite.</li></ol>${b(s.credential?'Sample credentials ready ✓':'Use sample credentials','credentials')}<small class="nx-help">Preview only. No real credentials are collected.</small>`;
if(s.step===2)body=`<div class="nx-fields">${field('SuiteApp directory','repo',s.repo)}${field('Branch','branch',s.branch)}</div><label>Source<select><option>GitLab repository</option><option>Local checkout</option></select></label>${field('Repository URL','url',s.url||'https://gitlab.example.com/team/bank-feeds-nsn.git')}`;
if(s.step===3)body=optional(s);
if(s.step===4)body=`<div class="nx-row"><span>Scrumbox</span><span>${esc(s.domain)}</span></div><div class="nx-row"><span>SuiteApp</span><span>${esc(s.repo)} · ${esc(s.branch)}</span></div><div class="nx-row"><span>Credentials</span><span class="nx-tag">Ready</span></div><div class="nx-notice">Open the workspace when you’re ready. Deployment starts only when you explicitly run it.</div>`;
return title('GET STARTED','Set up your workspace','A guided setup before your first task.')+`<div class="nx-stepbar" aria-label="Setup progress">${names.map((name,i)=>`<button type="button" data-do="step:${i}" ${i>s.step?'disabled':''} ${i===s.step?'aria-current="step"':''}>${i+1}. ${name}</button>`).join('')}</div><section class="nx-panel"><h2>${s.step+1}. ${names[s.step]}</h2>${body}<div class="nx-actions">${s.step?b('Back','back'):''}${b(s.step===4?'Open workspace':s.step===3?'Skip optional setup':'Save and continue',s.step===4?'finish':'next','nx-primary')}</div></section>`;}
function optional(s){return ['SFTP','Browser tests'].map(name=>`<div class="nx-row"><div><h3>${name}</h3><p>Optional. Configure now or later.</p></div>${b(s.ready[name]?'Configured ✓':'Configure sample','configure:'+name)}</div>`).join('');}
function settings(s){return title('WORKSPACE / SETTINGS','Workspace settings','Shared configuration, credentials, and appearance.')+`<section class="nx-panel"><h2>Scrumbox</h2><div class="nx-fields">${field('Scrumbox domain','domain',s.domain)}${field('NetSuite account ID','account',s.account)}</div><h2>SuiteApps</h2><div class="nx-fields">${field('Directory','repo',s.repo)}${field('Branch','branch',s.branch)}</div>${b('Save sample settings','save','nx-primary')}<details><summary>Advanced configuration JSON</summary><label>Configuration JSON<textarea spellcheck="false">${esc(JSON.stringify({suiteapps:[{directory:s.repo,branch:s.branch}],vms:[{url:s.domain,account:s.account}]},null,2))}</textarea></label><small class="nx-help">Illustrative configuration preview.</small></details><details><summary>Credentials and setup</summary><p>Shared credentials are configured.</p>${b('Revisit setup wizard','wizard')}</details><details><summary>Optional tools</summary>${optional(s)}</details></section>`;}
function tool(s){const name=s.page;let content='';
if(name==='Deploy')content=`<h2>SuiteApps and deployment targets</h2><div class="nx-row"><div><h3>${esc(s.repo)}</h3><p>Branch: ${esc(s.branch)}</p></div><span class="nx-tag">Ready</span></div><div class="nx-row"><div><h3>${esc(s.domain)}</h3><p>Deployment target · Account ${esc(s.account)}</p></div>${b('Edit','settings','nx-link')}</div><div class="nx-actions">${b(s.running?'Complete sample deployment':'Deploy sample SuiteApp',s.running?'complete':'run','nx-primary')}${b('View output','output')}</div>`;
if(name==='SQL')content=`<div class="nx-fields">${field('Database user','dbuser',s.dbuser||'shared')}${field('Service name','service',s.service||'singletonpdb')}</div><label>SQL statement<textarea data-value="query">${esc(s.query||'SELECT * FROM example_table;')}</textarea></label><div class="nx-actions">${b('Run sample query','query','nx-primary')}${b('View output','output')}</div>${s.result?'<pre>ID    NAME          STATUS\n1     Example A     Active\n2     Example B     Active\n\n2 sample rows returned.</pre>':''}`;
if(name==='SFTP')content=`<h2>${s.ready.SFTP?'Connection settings':'Set up file sharing'}</h2><div class="nx-fields">${field('Username','sftpUser',s.sftpUser||'suiteuser')}${field('Port','port',s.port||'2222')}</div><div class="nx-actions">${b(s.ready.SFTP?'Start sample SFTP':'Save sample SFTP settings',s.ready.SFTP?'sftp-run':'configure:SFTP','nx-primary')}</div><small class="nx-help">Uses the first configured VM. NetSuite connection details appear after starting.</small>${s.sftpOn?`<pre>Sample SFTP running\nHost: ${esc(s.domain)}\nPort: ${esc(s.port||'2222')}</pre>`:''}`;
if(name==='Browser tests')content=`<h2>${s.ready[name]?'Test configuration':'Set up browser tests'}</h2>${field('Project directory inside repos','project',s.project)}<label>Browser<select><option>Container browser</option><option>Local Chrome</option></select></label><div class="nx-actions">${b(s.ready[name]?'Run sample tests':'Enable sample runner',s.ready[name]?'tests-run':'configure:Browser tests','nx-primary')}</div><small class="nx-help">Runs against Current VM. Runner configuration changes may require relaunch.</small>${s.testsDone?'<pre>Sample test run completed\n2 passed · 0 failed</pre>':''}`;
const sub=name==='Deploy'?'Review the SuiteApps and targets, then deploy.':name==='SQL'||name==='SFTP'?'Target: first configured VM · '+esc(s.domain):'Current VM · '+esc(s.domain);
return title('TOOLS / '+name.toUpperCase(),name==='Deploy'?'Deploy SuiteApps':name,sub)+`<section class="nx-panel">${content}</section>`;}
function render(key){const host=root.querySelector('#nx-'+key),s=models[key],launcher=key==='launcher';let page=s.setupComplete?s.page:'Setup';
host.innerHTML=`<header class="nx-header"><div class="nx-wordmark"><span class="nx-logo">S</span>SuiteContainer</div><div class="nx-top-actions"><span class="nx-context">${esc(s.domain)} · ${esc(s.account)}</span>${launcher?`<button type="button" data-do="menu" aria-expanded="${s.menu}">${icon('grid-2x2')} Tools</button>${b('Settings','settings')}`:''}</div></header>${launcher?`<div class="nx-breadcrumb">${b('Home','home')}<span>/</span><span>${esc(page)}</span></div>${s.menu?`<section class="nx-launcher" aria-label="Tool launcher"><h2>Choose a tool</h2><div class="nx-launcher-grid">${toolButtons()}</div></section>`:''}`:`<nav class="nx-nav" aria-label="Workspace navigation">${[['Home','house'],...tools.map(([n,ic])=>[n,ic]),['Settings','settings']].map(([name,ic])=>`<button type="button" class="${name==='Settings'?'nx-settings':''}" data-do="${name==='Home'?'home':name==='Settings'?'settings':'open:'+name}" ${page===name?'aria-current="page"':''}>${icon(ic)}${name}</button>`).join('')}</nav>`}<main class="nx-main">${page==='Setup'?wizard(s):page==='Home'?home(s):page==='Settings'?settings(s):page==='Optional tools'?title('WORKSPACE','Optional tools','Configure only the tools you need.')+`<section class="nx-panel">${optional(s)}</section>`:tool(s)}<div class="nx-feedback" role="status" aria-live="polite">${esc(s.notice)}</div></main><div class="nx-bottom"><span>${!s.setupComplete?'Shared setup · Step '+(s.step+1)+' of 5':s.running?'Deployment running · '+esc(s.repo):'No operations running'}</span>${s.setupComplete?b(s.output?'Hide activity output':'Activity & output','output'):b('Save and return later','pause')}</div>${s.output?`<section class="nx-output" aria-label="Activity output"><pre>${s.running?'[sample] Validating '+esc(s.repo)+'\n[sample] Validation passed\n[sample] Uploading files…':s.result?'[sample] SQL query completed · 2 rows returned':s.finished?'[sample] Deployment completed':'No operations started in this preview.'}</pre></section>`:''}`;
if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function renderAll(){root.querySelectorAll('[data-experience]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.experience===experience)));render('top');render('launcher');}
root.addEventListener('click',event=>{const btn=event.target.closest('button');if(!btn||btn.disabled)return;
if(btn.dataset.experience){experience=btn.dataset.experience;Object.values(models).forEach(s=>{s.experience=experience;if(experience==='new'){s.setupComplete=false;s.page='Setup';}else{s.setupComplete=true;s.page='Home';}s.notice='';});renderAll();save();return;}
const host=btn.closest('.nx-product');if(!host)return;const key=host.id==='nx-top'?'top':'launcher',s=models[key],action=btn.dataset.do;if(!action)return;s.notice='';
if(action==='menu')s.menu=!s.menu;
else if(action==='pause')s.notice='Your sample setup progress is saved. Return to First-time setup to continue.';
else if(action==='output')s.output=!s.output;
else if(action==='credentials')s.credential=true;
else if(action==='back')s.step=Math.max(0,s.step-1);
else if(action.startsWith('step:'))s.step=Number(action.slice(5));
else if(action==='wizard'){s.setupComplete=false;s.step=0;s.page='Setup';}
else if(action==='next'||action==='finish'){let message='';if(!s.domain.trim()||s.domain.includes('://')||!s.account.trim())message='Enter a domain without https:// and an account ID.';else if(s.step===1&&!s.credential)message='Choose Use sample credentials to continue.';else if(s.step===2&&!s.repo.trim())message='Enter a SuiteApp directory.';if(message){s.notice=message;render(key);const feedback=host.querySelector('.nx-feedback');feedback.setAttribute('role','alert');return;}if(action==='finish'){s.setupComplete=true;s.page='Home';}else s.step=Math.min(4,s.step+1);}
else if(action==='home'){s.page=s.setupComplete?'Home':'Setup';s.menu=false;}
else if(action==='settings'){s.page=s.setupComplete?'Settings':'Setup';s.menu=false;}
else if(action==='optional')s.page='Optional tools';
else if(action.startsWith('open:')){s.page=s.setupComplete?action.slice(5):'Setup';s.menu=false;}
else if(action.startsWith('configure:')){s.ready[action.slice(10)]=true;s.notice='Sample configuration saved.';}
else if(action==='run'){s.running=true;s.finished=false;s.output=true;}
else if(action==='complete'){s.running=false;s.finished=true;s.output=true;}
else if(action==='query'){if(s.running){s.notice='Wait for deployment to finish before running SQL.';}else{s.result='done';s.notice='Sample query completed.';}}
else if(action==='sftp-run'){s.sftpOn=true;s.notice='Sample SFTP started.';}
else if(action==='tests-run'){s.testsDone=true;s.notice='Sample tests completed.';}
else if(action==='save')s.notice='Sample settings saved.';
render(key);save();});
root.addEventListener('input',e=>{const host=e.target.closest('.nx-product');if(host&&e.target.dataset.value){models[host.id==='nx-top'?'top':'launcher'][e.target.dataset.value]=e.target.value;save();}});
window.addEventListener('openai:set_globals',event=>{const data=event.detail?.globals?.widgetState?.privateContent;if(data?.version===2){experience=data.experience;Object.assign(models,data.models);renderAll();}});
renderAll();
if(globalThis.Tweak){for(const key of ['top','launcher']){const host=root.querySelector('#nx-'+key),state={spacing:'Comfortable'};const tweak=new Tweak({container:host,onChange:()=>{host.querySelector('.nx-main').style.padding=state.spacing==='Compact'?'20px':'28px';}});tweak.addSelect(state,'spacing',{label:'Content spacing',options:['Comfortable','Compact']});}}
})();
